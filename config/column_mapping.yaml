# CSV列名 → 内部フィールド名のマッピング
#
# 【要実測】実際にダウンロードしたCSVのヘッダ行を確認してから記入すること。
# 推測で埋めてはならない。未確定の項目は null のままにしておく。
#
# 列は位置ではなくヘッダ名で参照するため、列順が変わっても動作する。
# ここに書いた列名がCSVに存在しない場合、処理は例外を投げて停止する（意図的な仕様）。

a8net:
  encoding: null          # 【要実測】'shift_jis' または 'utf-8'
  programs:
    asp_program_id:     null
    program_name:       null
    advertiser_name:    null
    category:           null
    reward_raw:         null
    condition_text:     null
    partnership_status: null
    program_url:        null

moshimo:
  encoding: null          # 【要実測】
  programs:
    asp_program_id:     null
    program_name:       null
    advertiser_name:    null
    category:           null
    reward_raw:         null
    condition_text:     null
    partnership_status: null
    program_url:        null
  conversions:
    asp_conversion_id:  null
    occurred_at:        null
    status:             null
    reward_amount:      null
    custom_param:       null   # 「任意パラメータ」列
